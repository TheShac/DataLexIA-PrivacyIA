# Único punto de entrada: http://localhost
#   /              -> Frontend (Vite dev server, :5173)
#   /api/          -> Backend  (Express, :3000)
#   /socket.io/    -> Socket   (Socket.IO, :4000)
#
# nginx corre en Docker, por eso los servicios del host se alcanzan con
# host.docker.internal (ver docker-compose.yml).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # Necesario para el upgrade a WebSocket (Socket.IO y HMR de Vite)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream frontend {
        server host.docker.internal:5173;
    }

    upstream backend {
        server host.docker.internal:3000;
    }

    upstream socket {
        server host.docker.internal:4000;
    }

    server {
        listen 80;
        server_name localhost;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Backend REST (Express monta todo bajo /api)
        location /api/ {
            proxy_pass http://backend;
        }

        # Socket.IO (long-polling + WebSocket)
        location /socket.io/ {
            proxy_pass http://socket;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Health del servicio socket (opcional)
        location = /socket/health {
            proxy_pass http://socket/health;
        }

        # Frontend (incluye el WebSocket de HMR de Vite)
        location / {
            proxy_pass http://frontend;
            proxy_read_timeout 3600s;
        }
    }
}
